<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelton Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%238b5cf6'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/account.css">
  <link rel="stylesheet" href="/static/movil.css">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <header class="topbar">
      <div class="search" id="search-open"><span id="i-search"></span><span>Buscar o ir a…</span><span class="kbd">Ctrl K</span></div>
      <div class="grow"></div>
      <button class="working-pill" id="working-pill" title="Quién está trabajando ahora (clic para ver el panel En vivo)"></button>
      <div class="seg" id="mode-seg" title="Herramientas: solo locales, solo nube, o automático">
        <button data-mode="local">🖥️ Local</button><button data-mode="auto">Auto</button><button data-mode="cloud">☁️ Nube</button>
      </div>
      <button class="icon-btn" id="mode-info" title="¿Qué herramienta usa cada parte?">?</button>
      <div class="pill-local" id="local-pill" title="Estado de los motores"><span class="dot" id="local-dot"></span><span id="local-text">Local</span></div>
      <button class="btn sm" id="apis-btn" title="APIs conectadas: ver, cambiar claves y modelos"><span id="i-key"></span> APIs</button>
      <button class="icon-btn" id="bell" title="Avisos"><span id="i-bell"></span><span class="badge-num" id="bell-count"></span></button>
    </header>
    <section class="view" id="view"></section>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal hidden" id="modal"></div>
<div class="toasts" id="toasts"></div>
<div class="asks" id="asks"></div>
<script src="/static/app.js"></script>
<script src="/static/app2.js"></script>
<script src="/static/app3.js"></script>
<script src="/static/account.js"></script>
<script src="/static/lora.js"></script>
<script src="/static/archivos.js"></script>
<script src="/static/manual.js"></script>
<script src="/static/chatkeep.js"></script>
<script src="/static/copypaste.js"></script>
<script src="/static/consumo.js"></script>
<script src="/static/calidad.js"></script>
<script src="/static/granja.js"></script>
<script src="/static/privado.js"></script>
<script src="/static/modelos.js"></script>
<script src="/static/adjuntos.js"></script>
</body>
</html>
